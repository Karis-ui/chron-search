[phases.setup]
nixPkgs = [
  "python311",
  "ffmpeg",      
  "postgresql",     
  "gcc",        
  "libjpeg",       
  "libpng",
  "libtiff",
  "openexr",
  "freetype",
  "harfbuzz",
]
nixLibs =["libpq"] 

[phases.install]
cmds = [
  "pip install --upgrade pip setuptools wheel",
  "pip install -r requirements.txt"
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"